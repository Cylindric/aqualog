# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

dotenv:
  - .env

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list
    silent: true

  init:
    desc: Initialize the build environment
    cmds:
      - mkdir -p ./.build
      - mkdir -p ./.build/authentik/data/media/public/aqualog
      - cp assets/*.png ./.build/authentik/data/media/public/aqualog
      - mkdir -p ./.build/authentik/certs
      - mkdir -p ./.build/authentik/custom-templates
      - if [ ! -f ./.env ]; then cp .env.example .env; fi
      - sed -i "s|authdb_password_here|$(openssl rand -base64 36)|" .env
      - sed -i "s|backenddb_password_here|$(openssl rand -base64 36)|" .env
      - sed -i "s|authentik_secret_key_here|$(openssl rand -base64 60 | tr -d '\n')|" .env
      - cd backend && task init
      - cd frontend && task init

  init-terraform:
    desc: Initialize the Terraform environment
    dir: authentik/terraform
    cmds:
      - echo "authentik_url = \"http://localhost:8000\"" > .auto.tfvars
      - echo "authentik_token = \"your_token\"" >> .auto.tfvars
      - terraform init

  build-all:
    desc: Build all docker images
    cmds:
      - cd backend && task build
      - cd frontend && task build

  publish-all:
    desc: Publish all docker images
    cmds:
      - cd backend && task publish
      - cd frontend && task publish

  up:
    desc: Start all docker containers
    cmds:
      - docker-compose up

  gource:
    desc: Generate a gource video of the project
    cmds:
      - gource --output-custom-log .data/backend.txt backend
      - sed -i -r "s#(.+)\|#\1|/backend#" .data/backend.txt
      - gource --output-custom-log .data/frontend.txt frontend
      - sed -i -r "s#(.+)\|#\1|/frontend#" .data/frontend.txt
      - cat .data/backend.txt .data/frontend.txt | sort -n > .data/combined.txt
      - sed -i -r "s#Mark Hanford#Cylindric#" .data/combined.txt
      - |
        gource \
          --file-filter .*/openspec/changes/archive \
          --file-filter .*/.vscode \
          --file-filter .*/.agents \
          --file-filter .*/.github \
          .data/combined.txt
      # - gource --seconds-per-day 0.1 --auto-skip-seconds 1 --hide filenames,mouse,progress,filenames --output-ppm-stream - | ffmpeg -y -r 60 -f image2pipe -vcodec ppm -i - -vcodec libx264 -preset ultrafast -pix_fmt yuv420p gource.mp4